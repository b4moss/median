name: CodeQL

# Default setup は使わず、advanced setup でトリガを制御する。
# 方針: main への pull_request のときだけ解析する（develop / dev-v* / release では走らない）。
# median は private かつ GitHub Advanced Security 未導入のため、SARIF upload は行わない
# （upload: never）。GHAS 有効化後に upload を戻す。
# スキャフォールド段階では actions のみ（go / js ソースが揃ってから言語を追加する）。

on:
  pull_request:
    branches:
      - main

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:${{ matrix.language }}"
          # Private repo without GitHub Advanced Security cannot upload SARIF.
          upload: never
