name: Release on tag

# Language-scoped tags only:
#   vX.Y.Z                → JS (@b4moss/median)
#   packages/go/vX.Y.Z    → Go module (no npm)
#   packages/php/vX.Y.Z   → PHP Composer (no npm)
on:
  push:
    tags:
      - "v[0-9]*"
      - "packages/go/v[0-9]*"
      - "packages/php/v[0-9]*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create GitHub Release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi
          PRE=()
          if [[ "$TAG" =~ (alpha|beta|rc|rev|doc|docs) ]]; then
            PRE+=(--prerelease)
          fi
          TITLE="$TAG"
          if [[ "$TAG" == packages/go/v* ]]; then
            TITLE="Go ${TAG#packages/go/}"
          elif [[ "$TAG" == packages/php/v* ]]; then
            TITLE="PHP ${TAG#packages/php/}"
          elif [[ "$TAG" == v* ]]; then
            TITLE="JS ${TAG}"
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            --verify-tag \
            "${PRE[@]}"
